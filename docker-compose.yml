# 默认本地磁盘存储。需要 Garage/S3 时叠加 docker-compose.s3.yml。
services:
  kingei-app:
    build:
      context: .
    environment:
      DATABASE_URL: sqlite:///data/kinGei.db
      PORT: ${PORT:-3000}
      STATIC_DIR: /app/public
      JWT_SECRET: ${JWT_SECRET:-}
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: /kingei-data/files
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-100}
      RUST_LOG: info
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - ./KinGei-data/database/sqlite:/data
      - ./KinGei-data:/kingei-data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:${PORT:-3000}/api/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

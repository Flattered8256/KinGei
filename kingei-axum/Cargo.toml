[package]
name = "kinGei"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
tokio = { version = "1",features = ["macros","rt-multi-thread","process","fs","io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "derive", "chrono", "uuid", "migrate", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
async-stream = "0.3"
futures = "0.3"
dotenvy = "0.15.7"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bcrypt = "0.16"
jsonwebtoken = "9"
object_store = { version = "0.14", default-features = false, features = ["fs", "aws-base", "reqwest", "ring"] }
# 只为打开 reqwest 的 TLS 后端；object_store 的 reqwest 特性只开 stream。
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }

[features]
default = ["sqlite"]
sqlite = ["sqlx/sqlite"]
postgres = ["sqlx/postgres", "sqlx/tls-rustls-ring-native-roots"]
